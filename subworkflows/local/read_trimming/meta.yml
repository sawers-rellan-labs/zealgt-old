---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
# zealgt local subworkflow; see the header comment of main.nf and docs/PLAN_pipeline.md §3
# Versions: the modules publish their versions to the `versions` topic (collated in workflows/cram.nf);
# `versions` here re-emits the eval tuples [ process, tool, version ] of the nf-core-style modules.
name: read_trimming
description: TRIMMOMATIC (ILLUMINACLIP on the staged adapter FASTA) then FASTQC of the trimmed pairs
keywords:
  - zealgt
  - cram workflow
  - read_trimming
components:
  - trimmomatic
  - fastqc
input:
  - ch_reads:
      type: file
      description: |
        channel: [ val(meta), [ R1, R2 ] ]
  - ch_adapters:
      type: file
      description: |
        channel: value adapter FASTA
output:
  - reads:
      type: file
      description: |
        channel: [ val(meta), [ paired.trim_1, paired.trim_2 ] ]
  - qc:
      type: file
      description: |
        channel: [ val(meta), QC file ]
  - versions:
      type: list
      description: |
        channel: [ process, tool, version ]
  - task_outputs:
      type: list
      description: |
        channel: [ library, process, one output file of the task ] for every TRIMMOMATIC and FASTQC task (new or cached);
        the CRAM workflow turns the file into its task work dir for the end-of-run cleanup report
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
