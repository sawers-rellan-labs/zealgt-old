---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
# zealgt local subworkflow; see the header comment of main.nf and docs/PLAN_pipeline.md §3
# Versions: the modules publish their versions to the `versions` topic (collated in workflows/cram.nf);
# `versions` here re-emits the eval tuples [ process, tool, version ] of the nf-core-style modules.
name: read_trimming
description: CUTADAPT (TruSeq adapter per read, poly-G-aware quality trimming, minimum length) then FASTQC of the trimmed pairs
keywords:
  - zealgt
  - cram workflow
  - read_trimming
components:
  - cutadapt
  - fastqc
input:
  - ch_reads:
      type: file
      description: |
        channel: [ val(meta), [ R1, R2 ] ] (meta.single_end false)
output:
  - reads:
      type: file
      description: |
        channel: [ val(meta), [ <prefix>_1.trim.fastq.gz, <prefix>_2.trim.fastq.gz ] ]
  - qc:
      type: file
      description: |
        channel: [ val(meta), QC file ]
  - versions:
      type: list
      description: |
        channel: [ process, tool, version ]
  - task_outputs:
      type: list
      description: |
        channel: [ library, process, one output file of the task ] for every CUTADAPT and FASTQC task (new or cached);
        the CRAM workflow turns the file into its task work dir for the end-of-run cleanup report
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
