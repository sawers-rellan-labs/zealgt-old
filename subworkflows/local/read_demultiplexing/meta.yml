---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
# zealgt local subworkflow; see the header comment of main.nf and docs/PLAN_pipeline.md §3
# Versions: the modules publish their versions to the `versions` topic (collated in workflows/cram.nf);
# `versions` here re-emits the eval tuples [ process, tool, version ] of the nf-core-style modules.
name: read_demultiplexing
description: One DEMUX task per library x lane, MERGE_LANES, then the library's demux QC in the store (not made again if already stored)
keywords:
  - zealgt
  - cram workflow
  - read_demultiplexing
components:
  - demux
  - demux/qc  # modules/local/demux_qc (lint maps _ to /)
input:
  - ch_libraries:
      type: file
      description: |
        channel: [ val(meta), [ raw R1 ], [ raw R2 ], val(barcodes), val(read_structures), val(tar_members) ]
  - ch_stored_qc:
      type: file
      description: |
        channel: [ library id, [ <library>.tsv, <library>.summary.tsv ] ] demux QC already in the store ([] if not), one per library
  - val_subsample:
      type: integer
      description: |
        read pairs per library, 0 = all
output:
  - reads:
      type: file
      description: |
        channel: [ val(meta), [ <sample>_R{1,2}.fastq.gz ] ]
  - report:
      type: file
      description: |
        channel: [ val(meta), cutadapt report ]
  - demux_qc:
      type: file
      description: |
        channel: [ val(meta), <library>.tsv ]
  - summary:
      type: file
      description: |
        channel: [ val(meta), <library>.summary.tsv ]
  - versions:
      type: list
      description: |
        channel: [ process, tool, version ]
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
