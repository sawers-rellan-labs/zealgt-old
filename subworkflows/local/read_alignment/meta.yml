---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
# zealgt local subworkflow; see the header comment of main.nf and docs/PLAN_pipeline.md §3
# Versions: the modules publish their versions to the `versions` topic (collated in workflows/cram.nf);
# `versions` here re-emits the eval tuples [ process, tool, version ] of the nf-core-style modules.
name: read_alignment
description: ALIGN_MARKDUP for the samples not yet stored, then CRAM_QC_PROVENANCE for all
keywords:
  - zealgt
  - cram workflow
  - read_alignment
components:
  - align/markdup  # modules/local/align_markdup (lint maps _ to /)
  - cram_qc_provenance
input:
  - ch_reads:
      type: file
      description: |
        channel: [ val(meta), [ R1, R2 ] ]
  - ch_read_groups:
      type: string
      description: |
        channel: [ sample_id, read_group ]
  - ch_stored:
      type: file
      description: |
        channel: [ val(meta), cram, crai, [ versions.yml ] ]
  - ch_ref:
      type: file
      description: |
        channel: value [ val(meta2), fasta, fai, [ index ] ]
  - ch_records:
      type: map
      description: |
        channel: [ sample_id, record map ]
  - ch_stored_qc:
      type: file
      description: |
        channel: [ sample_id, [ QC files ] ]
output:
  - cram:
      type: file
      description: |
        channel: [ val(meta), cram, crai ]
  - qc:
      type: file
      description: |
        channel: [ val(meta), QC file ]
  - provenance:
      type: file
      description: |
        channel: [ val(meta), json ]
  - versions:
      type: list
      description: |
        channel: [ process, tool, version ]
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
