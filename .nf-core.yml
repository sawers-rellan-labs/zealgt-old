repository_type: pipeline

nf_core_version: 4.1.0

# zealgt deliberate deviations from the nf-core pipeline requirements (docs/usage.md "Deliberate deviations"):
#   - No Docker / Singularity (spec pipelines/requirements/docker, MUST): hazel compute nodes are offline and run no
#     container engine for this project; every module runs in a prebuilt, build-pinned conda prefix on /share
#     (scripts/build_envs.sh, conf/env_prefixes.config). The template's container configs (conf/containers_*.config) were
#     stale (FastQC / MultiQC only), never included, and are removed; `nf-core modules install/patch` regenerates them, so
#     they are gitignored and the container_configs lint test is off.
#   - No GitHub Actions CI (spec pipelines/requirements/ci_testing, MUST): the pipeline runs on a private offline cluster.
#     scripts/run_checks.sh runs the same checks locally before every push (nf-core lint, schema lint, nf-test, stub runs;
#     docs/CONTRIBUTING.md), so the github / ci template features are skipped and their files are not required.
lint:
  container_configs: false
  files_unchanged:
    - .prettierignore
    - docs/CONTRIBUTING.md
    - docs/README.md
    - CODE_OF_CONDUCT.md
    - assets/email_template.txt
    - assets/nf-core-zealgt_logo_light.png
    - docs/images/nf-core-zealgt_logo_light.png
    - docs/images/nf-core-zealgt_logo_dark.png
    - .github/.dockstore.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/pr-comment.yml
  nextflow_config:
    # zealgt: these defaults point into the checkout (${projectDir}/meta, assets/); lint expands projectDir in the
    # config but not in the schema, so the two strings never compare equal.
    - config_defaults:
        - params.input
        - params.import_sheet
        - params.registry_seed
        - params.trim_adapters
    # zealgt: resources are set per label (conf/base.config, closures x task.attempt) and per process (conf/hazel.config,
    # checked by scripts/check_resources.sh), not as plain process.cpus / memory / time defaults.
    - process.cpus
    - process.memory
    - process.time
    # zealgt: no nf-core/configs (skipped template feature nf_core_configs; the hazel profile lives in conf/hazel.config)
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    # zealgt: files of the skipped template features github / ci / igenomes / email / nf-core branding (see above)
    - .gitattributes
    - .github/.dockstore.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/awstest.yml
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/nf-test.yml
    - .github/workflows/pr-comment.yml
    - CODE_OF_CONDUCT.md
    - assets/email_template.html
    - assets/email_template.txt
    - assets/nf-core-zealgt_logo_light.png
    - assets/sendmail_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - docs/images/nf-core-zealgt_logo_dark.png
    - docs/images/nf-core-zealgt_logo_light.png
  readme:
    - nextflow_badge
    - nfcore_template_badge
  included_configs: false

template:
  org: sawers-rellan-labs
  name: zealgt
  description: 'ZEAL genotyping: raw libraries to analysis-ready CRAMs (CRAM workflow)
    and CRAM store to ancestry and imputed genotypes (genotype workflow)'
  author: Fausto Rodriguez Zapata
  version: 0.1.0dev
  outdir: .
  skip_features:
    - github
    - github_badges
    - ci
    - igenomes
    - nf_core_configs
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - email
    - rocrate
  is_nfcore: false
