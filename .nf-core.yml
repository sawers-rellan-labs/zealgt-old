repository_type: pipeline

nf_core_version: 4.1.0

# zealgt BEGIN deliberate deviations (agent/20260929_131500_write_deviations.py writes all four copies)
#   Deliberate deviations from the nf-core specifications. The same list, word for word, is in `.nf-core.yml`,
#   `docs/usage.md`, `docs/PLAN_pipeline.md` §2 and the nfcore-compliance skill; a new deviation goes into all four, with
#   its reason.
#   - **No containers** (spec: Docker / Singularity support). Hazel compute nodes are offline and run no container engine
#     for this project; every module has a pinned `environment.yml` instead. The template's container configs
#     (`conf/containers_*.config`) are removed and gitignored (`nf-core modules install/patch` regenerates them), and the
#     `container_configs` lint test is off.
#   - **No GitHub Actions CI** (spec: CI testing). The pipeline runs on a private offline cluster; `scripts/run_checks.sh`
#     runs the same checks on the laptop before every push (nf-core lint, schema lint, nextflow lint, nf-test, the env
#     prefix and resolved-resource checks; docs/CONTRIBUTING.md).
#   - **Build-pinned conda prefixes set per process in the site config** (spec: conda packages pinned by version, envs
#     created by Nextflow). `conf/env_prefixes.config`, generated by `scripts/build_envs.sh --write-config` and included by
#     the hazel and local profiles only, sets each process's `conda` to a prebuilt prefix on `/share` (config `conda`
#     overriding the module's, the standard Nextflow override). A prefix is keyed on the content of `environment.yml` (+
#     `build.sh`) only, so identical envs share one prefix; local modules pin version and build (linux-64 is the only
#     target); the prefixes are built once by an xfer job (compute nodes are offline), never at task time.
#   - **Cache test as an operator script, not an nf-test** (spec: tests are nf-test). `scripts/test_cache.sh` resumes one
#     Nextflow session across several runs (raised resources, an edited module, stage 2 alone) and compares the task hashes;
#     nf-test starts a new session for every run and cannot share one.
#   - **Permanent store and FASTQ checkpoint outside `--outdir`** (spec: outputs published to `--outdir`). CRAMs, QC,
#     provenance, demux QC and the registry are copied into `--store` (never overwritten) and the workflow skips work whose
#     stored output exists; the trimmed pairs are hardlinked into `--fastq_checkpoint` (the filesystem of `work/`), with
#     TRIMMOMATIC's small trim reports (one `publishDir` map: a second one whose path uses `meta` breaks `nextflow config -o
#     json`, so nf-core lint). Only reports go to `--outdir`.
#   - **`versions.yml` files for five local modules** (spec: versions as `eval` topic tuples). ALIGN_MARKDUP and
#     MARKDUP_IMPORT publish theirs next to the CRAM, one line per tool of the pipe, because PROVENANCE of an already stored
#     CRAM (skipped, not made again) needs the versions of the tools that made it; DEMUX_QC, PROVENANCE and REGISTRY are
#     python module templates, and Nextflow allows `eval` outputs only with Bash scripts. DEMUX and the nf-core modules
#     report `eval` topic tuples; coreutils (DEMUX's `head`, MERGE_LANES's `cat`) is pinned in `environment.yml` but not
#     reported (the BSD tools of the laptop's local runs have no `--version`).
#   - **Stage-2 samplesheet written by the pipeline** (spec: inputs through `--input`).
#     `<fastq_checkpoint>/<lib>/samplesheet.csv` is an output of stage 1 and the only input of `--entry read_alignment`,
#     validated by nf-schema against `assets/schema_checkpoint.json`.
#   - **`--subsample` / `--max_libraries` typed integer-or-string** (spec: typed parameters). Nextflow 26 hands CLI values
#     over as strings; the schema accepts digit strings and the code converts.
#   - **Per-source read structures as two parameters** (`read_structure_*`, chosen by `barcode_layout`), not one per sample;
#     both values are recorded in every provenance record.
#   - **CRAM output only, no `--bam`**: the genotype workflow reads CRAM.
# zealgt END deliberate deviations
lint:
  container_configs: false
  # Pinned binary source export (meta/sources/SOURCES.tsv) contains a literal "{{" in its cell data; not a template string.
  template_strings:
    - meta/sources/drive/23_ncs_psu_langebio_fields.xlsx
  files_unchanged:
    - .prettierignore
    - docs/CONTRIBUTING.md
    - docs/README.md
    - CODE_OF_CONDUCT.md
    - assets/email_template.txt
    - assets/nf-core-zealgt_logo_light.png
    - docs/images/nf-core-zealgt_logo_light.png
    - docs/images/nf-core-zealgt_logo_dark.png
    - .github/.dockstore.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/pr-comment.yml
  nextflow_config:
    # zealgt: these defaults point into the checkout (${projectDir}/meta, assets/); lint expands projectDir in the
    # config but not in the schema, so the two strings never compare equal.
    - config_defaults:
        - params.input
        - params.import_sheet
        - params.registry
        - params.registry_seed
        - params.trim_adapters
    # zealgt: resources are set per label (conf/base.config, closures x task.attempt) and per process (conf/hazel.config,
    # checked by scripts/check_resources.sh), not as plain process.cpus / memory / time defaults.
    - process.cpus
    - process.memory
    - process.time
    # zealgt: no nf-core/configs (skipped template feature nf_core_configs; the hazel profile lives in conf/hazel.config)
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    # zealgt: files of the skipped template features github / ci / igenomes / email / nf-core branding (see above)
    - .gitattributes
    - .github/.dockstore.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/awstest.yml
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/nf-test.yml
    - .github/workflows/pr-comment.yml
    - CODE_OF_CONDUCT.md
    - assets/email_template.html
    - assets/email_template.txt
    - assets/nf-core-zealgt_logo_light.png
    - assets/sendmail_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - docs/images/nf-core-zealgt_logo_dark.png
    - docs/images/nf-core-zealgt_logo_light.png
  readme:
    - nextflow_badge
    - nfcore_template_badge
  included_configs: false

template:
  org: sawers-rellan-labs
  name: zealgt
  description: 'ZEAL genotyping: raw libraries to analysis-ready CRAMs (CRAM workflow)
    and CRAM store to ancestry and imputed genotypes (genotype workflow)'
  author: Fausto Rodriguez Zapata
  version: 0.1.0dev
  outdir: .
  skip_features:
    - github
    - github_badges
    - ci
    - igenomes
    - nf_core_configs
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - email
    - rocrate
  is_nfcore: false
