repository_type: pipeline

nf_core_version: 4.1.0

# zealgt BEGIN deliberate deviations (agent/20260930_193000_write_deviations.py writes all four copies)
#   Deliberate deviations from the nf-core specifications. The same list, word for word, is in `.nf-core.yml`,
#   `docs/usage.md`, `docs/PLAN_pipeline.md` §2 and the nfcore-compliance skill; a new deviation goes into all four, with
#   its reason.
#   - **Images from the modules' `container` lines, not the template's container configs** (spec: the template's per-
#     platform `conf/containers_*.config`). Every module declares its image in its own `container` line: Seqera Containers
#     built from its `environment.yml` (versions only) for the conda modules, and images built by GitHub Actions from the
#     Dockerfile in the module directory for CRISP and RTIGER (not on conda; `ghcr.io/sawers-rellan-labs/zealgt-crisp`,
#     `zealgt-nilhmm`), which refuse a conda profile. Hazel runs linux/amd64 with Apptainer only, the SIFs downloaded once
#     into `apptainer.cacheDir` (compute nodes are offline). The per-platform configs and conda lock files are removed and
#     gitignored (`nf-core modules install/patch` regenerates them), and the `container_configs` lint test is off.
#   - **No GitHub Actions CI** (spec: CI testing). The pipeline runs on a private offline cluster; `scripts/run_checks.sh`
#     runs the same checks on the laptop before every push (nf-core lint, schema lint, nextflow lint, nf-test, the resolved-
#     resource check; docs/CONTRIBUTING.md).
#   - **Cache test as an operator script, not an nf-test** (spec: tests are nf-test). `scripts/test_cache.sh` resumes one
#     Nextflow session across several runs (raised resources, an edited module, stage 2 alone) and compares the task hashes;
#     nf-test starts a new session for every run and cannot share one.
#   - **Permanent store and FASTQ checkpoint outside `--outdir`** (spec: outputs published to `--outdir`). CRAMs, QC,
#     provenance, demux QC and the registry are copied into `--store` (never overwritten) and the workflow skips work whose
#     stored output exists; the trimmed pairs are hardlinked into `--fastq_checkpoint` (the filesystem of `work/`), with
#     CUTADAPT's log (one `publishDir` map: a second one whose path uses `meta` breaks `nextflow config -o json`, so nf-core
#     lint). The genotype workflow's keyed store `<store>/genotype/<genotype_store_key>/` works the same way: stage outputs
#     are copied there (never overwritten), a later `--entry` reads them, the workflow skips a unit whose stored outputs
#     exist, and a settings guard refuses a changed setting or code under the same key. Only reports go to `--outdir`.
#   - **`versions.yml` files for 25 local modules** (spec: versions as `eval` topic tuples). ALIGN_MARKDUP and
#     MARKDUP_IMPORT publish theirs next to the CRAM, one line per tool of the pipe, because PROVENANCE of an already stored
#     CRAM (skipped, not made again) needs the versions of the tools that made it; DEMUX_QC, PROVENANCE and REGISTRY and the
#     genotype modules COVERAGE_QC, DONOR_CONTENT_QC, DONOR_FOUNDER, GAP_FILLING_BC1, GAP_FILLING_LINES, GENOTYPE_SUMMARY,
#     LINE_MARKER_QC, MARKER_UNION, MIN_COVERAGE, POOLED_LIKELIHOOD_TIERS, RASTERIZE, READ_POSITION_QC, REGION_BED,
#     RELATEDNESS_QC, RTIGER_MARKERS, SAMPLE_LABELS, SAMPLE_QC_TABLE and WITNESS_VETO are python module templates,
#     CHROMOSOME_PAINTING and RTIGER R module templates, and Nextflow allows `eval` outputs only with Bash scripts. DEMUX
#     and the nf-core modules report `eval` topic tuples; coreutils (DEMUX's `head`, MERGE_LANES's `cat`) is pinned in
#     `environment.yml` but not reported (the BSD tools of the laptop's local runs have no `--version`).
#   - **Stage-2 samplesheet written by the pipeline** (spec: inputs through `--input`).
#     `<fastq_checkpoint>/<lib>/samplesheet.csv` is an output of stage 1 and the only input of `--entry read_alignment`,
#     validated by nf-schema against `assets/schema_checkpoint.json`.
#   - **`--subsample` / `--max_libraries` typed integer-or-string** (spec: typed parameters). Nextflow 26 hands CLI values
#     over as strings; the schema accepts digit strings and the code converts.
#   - **Per-source read structures as two parameters** (`read_structure_*`, chosen by `barcode_layout`), not one per sample;
#     both values are recorded in every provenance record.
#   - **CRAM output only, no `--bam`**: the genotype workflow reads CRAM.
#   - **nf-core `bcftools/mpileup` not used** (spec: use the nf-core module where one exists). The nf-core module always
#     pipes into `bcftools call` and reheaders to one sample (`meta.id`); every count of the genotype workflow needs the raw
#     `AD` of all its samples at fixed sites, with no calling, so the local `allele_counts` module runs `bcftools mpileup -I
#     -a AD -T <sites> | bcftools query` (`-I` because indel records would overwrite the SNP counts, PLAN §4 #3). Patching
#     the nf-core module would replace its whole script; `bcftools/view` is used (BED_CLIP).
#   - **nf-core `samtools/merge` not used for the witness pool** (spec: use the nf-core module where one exists). The merge
#     of the donor's line BAMs, the read-group rewrite and the index run as one pipe in `witness_pool`, so the ~2 GB
#     intermediate never reaches `work/` (PLAN §2 principle 5).
#   - **Stage subworkflow `MARKER_UNION_STAGE` in `subworkflows/local/marker_union`** (spec: a subworkflow is named after
#     its directory and combines at least two modules). A workflow cannot share its module's process name MARKER_UNION in
#     one script scope, so stage 5's subworkflow takes a `_STAGE` suffix; its directory keeps the stage (entry) name. It and
#     `genotype_imputation` (RASTERIZE) wrap one module each, because every `--entry` runs one stage subworkflow, so nf-core
#     lint warns that they include fewer than 2 modules.
# zealgt END deliberate deviations
lint:
  container_configs: false
  # Pinned binary source export (meta/sources/SOURCES.tsv) contains a literal "{{" in its cell data; not a template string.
  template_strings:
    - meta/sources/drive/23_ncs_psu_langebio_fields.xlsx
    # Rendered notebook (Quarto embed-resources): the embedded KaTeX/mermaid code contains literal "{{"; not a template string.
    - docs/notebooks/00_pipeline_overview.html
  files_unchanged:
    - .prettierignore
    - docs/CONTRIBUTING.md
    - docs/README.md
    - CODE_OF_CONDUCT.md
    - assets/email_template.txt
    - assets/nf-core-zealgt_logo_light.png
    - docs/images/nf-core-zealgt_logo_light.png
    - docs/images/nf-core-zealgt_logo_dark.png
    - .github/.dockstore.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/pr-comment.yml
  nextflow_config:
    # zealgt: these defaults point into the checkout (${projectDir}/meta, assets/); lint expands projectDir in the
    # config but not in the schema, so the two strings never compare equal.
    - config_defaults:
        - params.input
        - params.import_sheet
        - params.registry
        - params.registry_seed
        - params.genotype_input
    # zealgt: resources are set per label (conf/base.config, closures x task.attempt) and per process (conf/hazel.config,
    # checked by scripts/check_resources.sh), not as plain process.cpus / memory / time defaults.
    - process.cpus
    - process.memory
    - process.time
    # zealgt: no nf-core/configs (skipped template feature nf_core_configs; the hazel profile lives in conf/hazel.config)
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    # zealgt: files of the skipped template features github / ci / igenomes / email / nf-core branding (see above)
    - .gitattributes
    - .github/.dockstore.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/awstest.yml
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
    - .github/workflows/nf-test.yml
    - .github/workflows/pr-comment.yml
    - CODE_OF_CONDUCT.md
    - assets/email_template.html
    - assets/email_template.txt
    - assets/nf-core-zealgt_logo_light.png
    - assets/sendmail_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - docs/images/nf-core-zealgt_logo_dark.png
    - docs/images/nf-core-zealgt_logo_light.png
  readme:
    - nextflow_badge
    - nfcore_template_badge
  included_configs: false

template:
  org: sawers-rellan-labs
  name: zealgt
  description: 'ZEAL genotyping: raw libraries to analysis-ready CRAMs (CRAM workflow)
    and CRAM store to ancestry and imputed genotypes (genotype workflow)'
  author: Fausto Rodriguez Zapata
  version: 0.1.0dev
  outdir: .
  skip_features:
    - github
    - github_badges
    - ci
    - igenomes
    - nf_core_configs
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - email
    - rocrate
  is_nfcore: false
