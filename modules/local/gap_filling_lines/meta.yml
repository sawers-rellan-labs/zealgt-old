---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module with its own environment.yml (python only; identical copies share one content-keyed prefix).
name: gap_filling_lines
description: Stage-6 gap filling step 2, the per-line ALT rescue of one donor in one region at the gaps step 1 left missing - logit(pi) + LLR_BC1 + LLR_lines >= logit(0.999) -> ALT, never REF; lines split by RTIGER ancestry, donor-copy mappability c summed out under the taxon prior; flagged sites never promoted; x = 0 line reads are zero-class reads (eps_s) and significant ALT in them blocks the site. published to <store>/genotype/<key>/gap_lines/<set>.
keywords:
  - genotyping
  - gap filling
  - ancestry
  - likelihood ratio
tools:
  - python:
      description: Python standard library script (module template, templates/fill_gaps_lines.py)
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map with the donor x region
          e.g. [ id:'Zx.0540_P3.chr10_1-20000000', donor:'Zx.0540_P3', region:'chr10_1-20000000' ]
    - gap_bc1:
        type: file
        description: GAP_FILLING_BC1 table of the set (the donor's rows are used; carries LLR, prior, flags, n0, a0)
        pattern: "*.tsv{,.gz}"
        ontologies: []
    - lines_counts:
        type: file
        description: LINE_UNION_COUNTS table of the donor's lines at the union sites (bcftools query -H chrom pos ref alt [AD]; sample names = line ids)
        pattern: "*.tsv{,.gz}"
        ontologies: []
    - segments:
        type: file
        description: RTIGER segments of the donor's lines (source donor name chr start_bp end_bp state; state = dosage 0/1/2)
        pattern: "*.{csv,tsv}"
        ontologies: []
    - line_qc:
        type: file
        description: LINE_MARKER_QC line_qc.tsv (columns sample and line_pass = true|false, one row per contig); [] = every line with segments is used
        pattern: "*.tsv"
        ontologies: []
    - c_prior:
        type: file
        description: Mappability prior of the donor's taxon, <taxon>.prior.tsv (columns c, weight); [] only with --mappability-prior-mode flat
        pattern: "*.prior.tsv"
        ontologies: []
  - donor:
      type: string
      description: The donor whose rows are read from the gap_bc1 table
output:
  calls:
    - - meta:
          type: map
          description: Groovy Map with the donor x region
      - "*.tsv.gz":
          type: file
          description: "Per step-1 missing site: chrom pos ref alt prior llr_bc1 llr_lines logodds_combined call eps_s eps0 n0 a0 n0_lines a0_lines n_donor_lines a_donor_lines lines_x0 lines_donor ks p_b73_lines; call in ALT, undecided, blocked_flag, blocked_b73_lines, no_test"
          pattern: "*.tsv.gz"
          ontologies: []
  summary:
    - - meta:
          type: map
          description: Groovy Map with the donor x region
      - "*.summary.tsv":
          type: file
          description: "One row: counts per call, lines used / excluded, x = 0 ALT-read rate at the ALT calls and undecided sites, c prior used"
          pattern: "*.summary.tsv"
          ontologies: []
  versions:
    - "*.gap_filling_lines.versions.yml":
        type: file
        description: "Tool versions (python); a module template: `eval` outputs need a Bash script"
        pattern: "*.gap_filling_lines.versions.yml"
        ontologies: []
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
