---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module with its own environment.yml (python only; identical copies share one content-keyed prefix).
name: genotype_summary
description: Reporting tables of one donor x region - per-line RTIGER Mb in x = 0 / 1 / 2 and raster no-call share against the BC2S2 (or BC2S3) expectation, per-site segregation (chi-square, 2 df) and donor allele frequency vs 12.5 %, and the share of step-2 calls near RTIGER breakpoints vs elsewhere (review #12).
keywords:
  - genotyping
  - reporting
  - segregation
  - breakpoints
tools:
  - python:
      description: Python standard library script (module template, templates/summarize_genotypes.py)
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map with the donor x region
          e.g. [ id:'Zx.0540_P3.chr10_1-20000000', donor:'Zx.0540_P3', region:'chr10_1-20000000' ]
    - genotypes:
        type: file
        description: RASTERIZE long table
        pattern: "*.tsv{,.gz}"
        ontologies: []
    - segments:
        type: file
        description: RTIGER segments of the donor's lines
        pattern: "*.{csv,tsv}"
        ontologies: []
    - donor_alleles:
        type: file
        description: DONOR_FOUNDER table (call_step gives own markers and step-2 calls)
        pattern: "*.tsv{,.gz}"
        ontologies: []
    - line_qc:
        type: file
        description: LINE_MARKER_QC line_qc.tsv (columns sample and line_pass = true|false, one row per contig); [] = no line excluded
        pattern: "*.tsv"
        ontologies: []
output:
  summary:
    - - meta:
          type: map
          description: Groovy Map with the donor x region
      - "*.genotype_summary.tsv":
          type: file
          description: "Per line (+ ALL): Mb and fractions in x = 0 / 1 / 2, expectation, raster counts, no-call share"
          pattern: "*.genotype_summary.tsv"
          ontologies: []
  single_locus:
    - - meta:
          type: map
          description: Groovy Map with the donor x region
      - "*.single_locus.tsv":
          type: file
          description: "Per site: x counts, donor segment / allele frequency, HET and x = 2 frequency vs expectation, chi-square and p"
          pattern: "*.single_locus.tsv"
          ontologies: []
  breakpoint_density:
    - - meta:
          type: map
          description: Groovy Map with the donor x region
      - "*.breakpoint_density.tsv":
          type: file
          description: "Per line (+ ALL): gap sites and step-2 calls within the window of a RTIGER breakpoint vs elsewhere"
          pattern: "*.breakpoint_density.tsv"
          ontologies: []
  versions:
    - "*.genotype_summary.versions.yml":
        type: file
        description: Tool versions (python); `eval` outputs are not allowed with a python template script
        pattern: "*.genotype_summary.versions.yml"
        ontologies: []
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
