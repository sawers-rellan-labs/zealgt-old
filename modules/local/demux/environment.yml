---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# DEMUX: cutadapt 4.9 as zealbc1 ran it (envs/legacy_zealbc1/assembly.list.txt), with the python it ran on; pigz / coreutils
# (cat, head, mkfifo) / tar for the input stage (lane streaming, --subsample, batch-1 tar members). Versions only (nf-core); the container image is built from these specs.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::cutadapt=4.9
  - conda-forge::python=3.12.14
  - conda-forge::pigz=2.8
  - conda-forge::coreutils=9.11
  - conda-forge::tar=1.35
  - conda-forge::gzip=1.14
