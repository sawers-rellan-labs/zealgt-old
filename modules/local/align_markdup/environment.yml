---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# ALIGN_MARKDUP: minibwa + samtools piped in one script (as nf-core bwamem2/mem pins bwa-mem2 + samtools); the versions
# zealbc1 ran (envs/legacy_zealbc1/assembly.list.txt). Exact version + build.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::minibwa=0.7
  - bioconda::samtools=1.21
  - bioconda::htslib=1.21
