---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module with its own environment.yml (python only; identical copies share one content-keyed prefix).
name: relatedness_qc
description: Stage 2b relatedness QC; VanRaden-centred kinship of each sample to each donor group on the blind QC panel (pseudo-haploid reads for lines, ALT fractions for BC1 pools), flagging samples far below their own donor group or closer to another donor.
keywords:
  - sample qc
  - relatedness
  - kinship
  - genotype
tools:
  - python:
      description: Python standard library script (module template, templates/estimate_relatedness.py)
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map for the cohort
          e.g. [ id:'cohort' ]
    - counts:
        type: file
        description: QC_PANEL_COUNTS tables (ALLELE_COUNTS, bcftools query -H %CHROM %POS %REF %ALT [%AD], one column per sample SM)
        pattern: "*.ad.tsv.gz"
        ontologies: []
  - panel:
      type: file
      description: Blind QC panel, chrom pos [ref alt], tab-separated, no header needed (params.qc_panel)
      pattern: "*.{tsv,tsv.gz}"
      ontologies: []
  - sample_map:
      type: list
      description: "[ sample, role, donor ] per cohort sample (role bc1_sample | line | b73_control; donor '' for B73 controls)"
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map for the cohort
            e.g. [ id:'cohort' ]
      - "*.relatedness.tsv":
          type: file
          description: "One row per sample: method, n_sites, kinship_self, kinship_own, n_sites_own, own_z, closest_other_donor, kinship_closest_other, flag, reason (low_kinship_own_donor | closer_to_other_donor | insufficient_sites | .)"
          pattern: "*.relatedness.tsv"
          ontologies: []
  donors:
    - - meta:
          type: map
          description: |
            Groovy Map for the cohort
            e.g. [ id:'cohort' ]
      - "*.relatedness_donors.tsv":
          type: file
          description: "Long table: sample x donor group kinship and the number of sites behind it"
          pattern: "*.relatedness_donors.tsv"
          ontologies: []
  versions:
    - "*.relatedness_qc.versions.yml":
        type: file
        description: Tool versions (python); a file: a module template: `eval` outputs need a Bash script
        pattern: "*.relatedness_qc.versions.yml"
        ontologies: []
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
