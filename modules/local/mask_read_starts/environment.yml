---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# MASK_READ_STARTS: samtools view/index and gawk (soft-mask the first bases of every read); the same samtools/htslib/gawk
# as MARKDUP_IMPORT (modules/local/markdup_import/environment.yml). Versions only (nf-core); the container image is built from these specs.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::samtools=1.21
  - bioconda::htslib=1.21
  - conda-forge::gawk=5.4.1
