---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module (step-named; the name keys the hazel conda prefix). samtools + gawk in one pipe per sample.
name: mask_read_starts
description: Set the base qualities of the first mask_r1 / mask_r2 cycles of R1 / R2 (read orientation, soft clips counted) to Q0 in the region-limited reads of one donor x region x role, and give each sample exactly one read group (SM = sample id); one task per role group, samples in parallel.
keywords:
  - base quality
  - read start
  - mask
  - read group
tools:
  - samtools:
      description: Tools for manipulating next-generation sequencing data (view -M -L, addreplacerg, index, idxstats)
      homepage: http://www.htslib.org/
      documentation: https://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      licence: ["MIT"]
      identifier: biotools:samtools
  - gawk:
      description: GNU awk (the QUAL mask on the SAM stream, and the drop of the input @RG header lines)
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map of the unit (one donor x region x role)
          e.g. [ id:'Zx.0540_P3.chr10_1-20000000', donor:'Zx.0540_P3', region:'chr10_1-20000000' ]
    - crams:
        type: file
        description: Input CRAMs (or BAMs) of the group's samples, in the order of ids
        pattern: "*.{cram,bam}"
        ontologies: []
    - crais:
        type: file
        description: Their indexes
        pattern: "*.{crai,bai,csi}"
        ontologies: []
    - ids:
        type: list
        description: Sample ids ([A-Za-z0-9_-]+, no dots), one per CRAM; the output BAM names and read-group SM
    - masks:
        type: list
        description: "[ mask_r1, mask_r2 ] per sample, integers 0-30 (the genotype sheet columns)"
  - - meta2:
        type: map
        description: |
          Groovy Map containing region information
          e.g. [ id:'chr10_1-20000000' ]
    - bed:
        type: file
        description: The region's lowcopy BED (REGION_BED); only reads overlapping it are kept
        pattern: "*.bed"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'B73' ]
    - fasta:
        type: file
        description: Reference FASTA (CRAM decoding)
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
        ontologies: []
    - fai:
        type: file
        description: FASTA index
        pattern: "*.fai"
        ontologies: []
  - region:
      type: string
      description: Region, 'chr' or 'chr:start-end'
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map of the unit
            e.g. [ id:'Zx.0540_P3.chr10_1-20000000', donor:'Zx.0540_P3', region:'chr10_1-20000000' ]
      - "masked/*.bam":
          type: file
          description: One masked, region-limited BAM per sample, masked/<sample>.bam, one @RG (ID = SM = sample)
          pattern: "*.bam"
          ontologies: []
      - "masked/*.bam.bai":
          type: file
          description: BAM indexes
          pattern: "*.bam.bai"
          ontologies: []
  masks:
    - - meta:
          type: map
          description: |
            Groovy Map of the unit
            e.g. [ id:'Zx.0540_P3.chr10_1-20000000' ]
      - "${task.ext.prefix ?: meta.id}.masks.tsv":
          type: file
          description: Per sample the input file, the masks applied and the records written
          pattern: "*.masks.tsv"
          ontologies: []
  versions:
    - "${task.ext.prefix ?: meta.id}.mask_read_starts.versions.yml":
        type: file
        description: Tool versions (samtools, gawk)
        pattern: "*.mask_read_starts.versions.yml"
        ontologies: []
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
