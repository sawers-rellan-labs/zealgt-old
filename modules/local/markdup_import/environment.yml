---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# MARKDUP_IMPORT: samtools (addreplacerg, collate, fixmate, sort, markdup, index), the same samtools as ALIGN_MARKDUP so
# imported and new CRAMs carry duplicate flags from one markdup version; gawk drops stale @RG header lines of multi-RG
# inputs. Versions only (nf-core); the container image is built from these specs.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::samtools=1.21
  - bioconda::htslib=1.21
  - conda-forge::gawk=5.4.1
