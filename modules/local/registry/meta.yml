---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module. Wraps a python module template.
name: registry
description: Demux registry entry of one library, written only when its demux QC table and all its sample CRAMs are in the store; published to <outdir>/registry.
keywords:
  - registry
  - demultiplexing
tools:
  - python:
      description: Python standard library script (module template, templates/write_registry.py)
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
      identifier: ""
      args_id: ""
input:
  - - meta:
            type: map
            description: |
              Groovy Map containing library information
              e.g. [ id:'LIBX', library:'LIBX', source:'bc1', layout:'symmetric' ]
    - demux_qc:
        type: file
        description: Per-sample demux QC table of the library
        pattern: "*.tsv"
        ontologies: []
    - crams:
        type: file
        description: CRAMs and indexes of every sample of the library
        pattern: "*.{cram,crai}"
        ontologies: []
    - samples:
        type: list
        description: Sample ids of the library
  - store:
      type: string
      description: Store root (recorded)
  - run_id:
      type: string
      description: Run id (recorded)
  - code_version:
      type: string
      description: Git commit of the checkout (recorded)
  - subsample:
      type: integer
      description: Read pairs per library of the run (0 = all; recorded)
output:
  tsv:
    - - meta:
            type: map
            description: |
              Groovy Map containing library information
              e.g. [ id:'LIBX', library:'LIBX', source:'bc1', layout:'symmetric' ]
      - "*.registry.tsv":
          type: file
          description: "One row per sample: demux read pairs, CRAM bytes, store, run"
          pattern: "*.registry.tsv"
          ontologies: []
  versions:
    - "*.registry.versions.yml":
        type: file
        description: Tool versions (one line per tool), kept next to the output in the store (read back for an already-stored output)
        pattern: "*.registry.versions.yml"
        ontologies: []
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
