---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module with its own environment.yml (python only; identical copies share one content-keyed prefix).
name: rasterize
description: Genotypes of a donor's lines at the non-multiallelic union sites of a region (math supplement Eq. S5.1) - gt = x if D = ALT, 0 if D = REF, NA if D is missing and x > 0, NA where the ancestry is unknown or the line was excluded by line QC; dosage_expected = x * p_alt. Long and wide tables. published to <store>/genotype/<key>/genotypes/<set>.
keywords:
  - genotyping
  - imputation
  - raster
  - ancestry
tools:
  - python:
      description: Python standard library script (module template, templates/rasterize_genotypes.py)
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map with the donor x region
          e.g. [ id:'Zx.0540_P3.chr10_1-20000000', donor:'Zx.0540_P3', region:'chr10_1-20000000' ]
    - donor_alleles:
        type: file
        description: DONOR_FOUNDER table (chrom pos ref alt D call_step logodds p_alt)
        pattern: "*.tsv{,.gz}"
        ontologies: []
    - segments:
        type: file
        description: RTIGER segments of the donor's lines (source donor name chr start_bp end_bp state)
        pattern: "*.{csv,tsv}"
        ontologies: []
    - line_qc:
        type: file
        description: LINE_MARKER_QC line_qc.tsv (columns sample and line_pass = true|false, one row per contig); [] = no line excluded
        pattern: "*.tsv"
        ontologies: []
output:
  genotypes:
    - - meta:
          type: map
          description: Groovy Map with the donor x region
      - "*.tsv.gz":
          type: file
          description: "Long table: line chrom pos ref alt x D gt dosage_expected"
          pattern: "*.tsv.gz"
          ontologies: []
  matrix:
    - - meta:
          type: map
          description: Groovy Map with the donor x region
      - "*.matrix.tsv.gz":
          type: file
          description: "Wide table: one row per site (chrom pos ref alt), one gt column per line"
          pattern: "*.matrix.tsv.gz"
          ontologies: []
  versions:
    - "*.rasterize.versions.yml":
        type: file
        description: Tool versions (python); a module template: `eval` outputs need a Bash script
        pattern: "*.rasterize.versions.yml"
        ontologies: []
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
