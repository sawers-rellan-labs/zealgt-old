---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module. No own environment.yml: it runs in the shared genotype python env
# (conda "${moduleDir}/../pooled_likelihood_tiers/environment.yml", envs/process_aliases.tsv COVERAGE_QC -> pooled_likelihood_tiers).
name: coverage_qc
description: Stage 2b panel coverage report; covered blind-panel markers (>= 1 read) per sample x chromosome from the QC_PANEL_COUNTS tables, with the counts below the marker floor and below 10 / 100. Reports only; the line exclusion is applied in ancestry_inference (LINE_MARKER_QC).
keywords:
  - sample qc
  - coverage
  - genotype
tools:
  - python:
      description: Python standard library script (module template, templates/count_panel_coverage.py)
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map for the cohort
          e.g. [ id:'cohort' ]
    - counts:
        type: file
        description: QC_PANEL_COUNTS tables (ALLELE_COUNTS, bcftools query -H %CHROM %POS %REF %ALT [%AD], one column per sample SM)
        pattern: "*.ad.tsv.gz"
        ontologies: []
  - panel:
      type: file
      description: Blind QC panel, chrom pos [ref alt], tab-separated, no header needed (params.qc_panel)
      pattern: "*.{tsv,tsv.gz}"
      ontologies: []
  - sample_map:
      type: list
      description: "[ sample, role, donor ] per cohort sample (role bc1_sample | line | b73_control; donor '' for B73 controls)"
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map for the cohort
            e.g. [ id:'cohort' ]
      - "*.panel_coverage.tsv":
          type: file
          description: "Per sample x contig: n_sites, covered, covered_frac, reads, mean_depth, counted, below_min_markers, below_10, below_100"
          pattern: "*.panel_coverage.tsv"
          ontologies: []
  versions:
    - "*.coverage_qc.versions.yml":
        type: file
        description: Tool versions (python); a file, not `eval`, so the process may use storeDir
        pattern: "*.coverage_qc.versions.yml"
        ontologies: []
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
