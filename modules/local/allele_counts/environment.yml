---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# ALLELE_COUNTS (and its aliases, envs/process_aliases.tsv): bcftools mpileup -I -a AD at fixed sites | bcftools query,
# bgzip; the bcftools zealbc1 ran (envs/legacy_zealbc1/assembly.list.txt, nilhmm.list.txt). Versions only (nf-core); the container image is built from these specs.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::bcftools=1.21
  - bioconda::htslib=1.21
  - conda-forge::gzip=1.14
