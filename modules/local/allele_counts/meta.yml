---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# zealgt local module (step-named; the name keys the hazel conda prefix). Included under many aliases
# (envs/process_aliases.tsv: QC_PANEL_COUNTS, B73_CONTROL_COUNTS, BC1_SITE_COUNTS, LINE_ALLELE_COUNTS, UNION_SITE_COUNTS,
# B73_UNION_COUNTS, LINE_UNION_COUNTS -> allele_counts).
name: allele_counts
description: Per-sample allele depths (AD) at fixed sites for a batch of BAMs (one donor x region x role, or one donor set x region) with bcftools mpileup -I -a AD | bcftools query -H; one bgzipped table, samples named by read-group SM and checked against the input ids.
keywords:
  - allele counts
  - pileup
  - fixed sites
tools:
  - bcftools:
      description: Utilities for variant calling and manipulating VCFs and BCFs (mpileup, query)
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      doi: 10.1093/bioinformatics/btp352
      licence: ["MIT"]
      identifier: biotools:bcftools
      args_id: "$args"
  - htslib:
      description: bgzip of the table
      homepage: http://www.htslib.org/
      documentation: https://www.htslib.org/doc/bgzip.html
      doi: 10.1093/gigascience/giab007
      licence: ["MIT"]
      identifier: biotools:htslib
input:
  - - meta:
        type: map
        description: |
          Groovy Map of the batch
          e.g. [ id:'Zx.0540_P3.chr10_1-20000000', donor:'Zx.0540_P3', region:'chr10_1-20000000' ]
    - bams:
        type: file
        description: BAMs (masked, one @RG each; MASK_READ_STARTS)
        pattern: "*.bam"
        ontologies: []
    - bais:
        type: file
        description: Their indexes
        pattern: "*.bam.bai"
        ontologies: []
    - ids:
        type: list
        description: Sample ids of the BAMs, in order; the table's sample columns must equal them (read-group SM)
  - - meta2:
        type: map
        description: |
          Groovy Map of the site list
          e.g. [ id:'Zx.0540_P3.chr10_1-20000000' ]
    - sites:
        type: file
        description: Site list, chrom and pos in the first two columns (ref, alt may follow); lines with a non-numeric pos are skipped
        pattern: "*.{tsv,txt}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'B73' ]
    - fasta:
        type: file
        description: Reference FASTA
        pattern: "*.{fa,fasta}"
        ontologies: []
    - fai:
        type: file
        description: FASTA index
        pattern: "*.fai"
        ontologies: []
  - region:
      type: string
      description: Region 'chr' or 'chr:start-end' (mpileup -r)
output:
  counts:
    - - meta:
          type: map
          description: |
            Groovy Map of the batch
            e.g. [ id:'Zx.0540_P3.chr10_1-20000000' ]
      - "${task.ext.prefix ?: meta.id}.ad.tsv.gz":
          type: file
          description: "bcftools query -H table: #[1]CHROM [2]POS [3]REF [4]ALT [5]<sample>:AD ..., one row per covered site, AD in REF,ALT order (ALT may include <*>)"
          pattern: "*.ad.tsv.gz"
          ontologies: []
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: Name of the process
      - bcftools:
          type: string
          description: Name of the tool
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_htslib:
    - - ${task.process}:
          type: string
          description: Name of the process
      - htslib:
          type: string
          description: Name of the tool
      - "bgzip --version | sed '1!d; s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - bcftools:
          type: string
          description: Name of the tool
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: Name of the process
      - htslib:
          type: string
          description: Name of the tool
      - "bgzip --version | sed '1!d; s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@faustovrz"
maintainers:
  - "@faustovrz"
