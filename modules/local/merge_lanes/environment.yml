---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# MERGE_LANES: coreutils (cat, mkdir), the coreutils DEMUX pins, and gzip (the stub's empty .fastq.gz). Versions only (nf-core); the container image is built from these specs.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::coreutils=9.11
  - conda-forge::gzip=1.14
